# The platform: Apache Airflow 3 + a Databricks target. Names no product.
#
# The product arrives two ways, and they are DIFFERENT MECHANISMS that people
# routinely conflate:
#
#   its DAG FILES      -> a bundle (bind mount here, GitDagBundle in production)
#   its DEPENDENCIES   -> uv pip install of its pyproject.toml into the worker
#
# The bundle delivers files and installs nothing. A product whose DAGs import a
# library the worker lacks parses fine and fails at run time.
#
# WHAT THIS PLATFORM IS FOR. fabric-platform-airflow3 already proves an external
# Airflow 3 can drive a medallion; databricks-platform-jobs already proves the
# Databricks steps produce the family's numbers. This is the cell where those
# two claims meet: the same product, the same orchestrator, a different engine.
# If the orchestrator were really portable, this platform is what shows it.
#
# PORTS ARE ITS OWN. The Jobs platform publishes 18470/18471/18170 and the
# Fabric Airflow platform publishes 18080; a fourth stack on one machine must
# not fight any of them, and a collision reports as a bind failure naming
# neither side.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 3s
      retries: 20

  uc:
    image: unitycatalog/unitycatalog:${UC_VERSION:?see versions.env}
    # A CAPPED HEAP AND A CAPPED CONTAINER. Unity Catalog is a JVM, and a JVM
    # with no -Xmx sizes its heap from what it believes the machine has -- here
    # 15.66 GiB, most of which belongs to other stacks. Under `register`, which
    # creates eight external tables in quick succession, it aborted with SIGABRT
    # (exit 134) and a corretto crash log, twice, at the same point.
    #
    # That failure arrives three layers away from its cause: Sail reports
    # `error sending request` to UC, the task reports eight tables FAILED, and
    # nothing anywhere says a JVM died. The Jobs cell does not hit it because it
    # is usually the only stack running.
    environment:
      _JAVA_OPTIONS: "-Xmx1g -XX:MaxMetaspaceSize=256m"
    mem_limit: 1536m
    ports:
      - "18476:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/2.1/unity-catalog/catalogs"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s

  sail:
    image: ghcr.io/calvinchengx/emulator-sail:${SAIL_VERSION:?see versions.env}
    depends_on:
      uc: {condition: service_healthy}
    volumes:
      - ${DELTA_DATA:-/tmp/dbx-airflow-delta}:/data/delta
    environment:
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"
      UNITY_ALLOW_HTTP_URL: "true"
      SAIL_CATALOG__DEFAULT_CATALOG: sail
      # UC_CATALOG is REQUIRED, like PRODUCT and SOURCES. The catalog belongs
      # to whichever product is mounted -- it creates the catalog and
      # materialises gold into it -- so this platform cannot know the name.
      # A default here would hand a second product the first one's catalog.
      SAIL_CATALOG__LIST: '[{name="sail", type="memory", initial_database=["default"]}, {type="unity", name="${UC_CATALOG:?set UC_CATALOG to the catalog your product uses}", uri="http://uc:8080/api/2.1/unity-catalog", default_catalog="${UC_CATALOG:?set UC_CATALOG to the catalog your product uses}"}]'
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 3s
      timeout: 2s
      retries: 30

  spark-agent:
    image: ghcr.io/calvinchengx/emulator-spark-agent:${SPARK_AGENT_VERSION:?see versions.env}
    depends_on:
      sail: {condition: service_healthy}
    volumes:
      - ${DELTA_DATA:-/tmp/dbx-airflow-delta}:/data/delta
    environment:
      SPARK_REMOTE: "sc://sail:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 30

  databricks:
    image: ghcr.io/calvinchengx/databricks-emulator:${DATABRICKS_EMULATOR_VERSION:?see versions.env}
    depends_on:
      spark-agent: {condition: service_healthy}
      uc: {condition: service_healthy}
    ports:
      - "18475:8447"
    volumes:
      - ${DATABRICKS_DATA:-./data}:/data
      - ${DELTA_DATA:-/tmp/dbx-airflow-delta}:/data/delta
    environment:
      # THE JOBS PLATFORM'S ENVIRONMENT, VARIABLE FOR VARIABLE. What was here
      # before was invented from the names the emulator's flags suggested --
      # DATABRICKS_ADDR, DATABRICKS_SPARK_AGENT_URL, a UC url carrying the API
      # path -- and the emulator ignored all three, kept TLS on, and answered
      # the worker's first request with "Client sent an HTTP request to an
      # HTTPS server". Guessing an interface that a working example already
      # spells out is how a cell built to isolate ONE variable acquires four.
      DATABRICKS_DISABLE_TLS: "1"
      DATABRICKS_DATA_DIR: /data
      DATABRICKS_PUBLIC_URL: http://127.0.0.1:18475
      DATABRICKS_SPARK_CONNECT_URL: http://spark-agent:8099
      DATABRICKS_SPARK_CONNECT_GRPC_URL: http://sail:50051
      DATABRICKS_UC_URL: http://uc:8080
    healthcheck:
      test: ["CMD", "databricks-emulator", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30

  airflow:
    build:
      context: ${PRODUCT}/..
      dockerfile: ${PWD}/Dockerfile.worker
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.1}
        PRODUCT_DIR: ${PRODUCT_NAME:-product}
    depends_on:
      postgres: {condition: service_healthy}
      databricks: {condition: service_healthy}
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # THE BUNDLE. Rooted at the product's `dags/` SUBDIRECTORY, which is the
      # production shape too -- GitDagBundle takes a subdir the same way.
      AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
        [{"name":"product","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/product/dags"}}]
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "5"
      # AIRFLOW 3 RUNS TASKS THROUGH THE API SERVER, not the metadata DB. A
      # stack without api-server fails every task with
      # `httpcore.ConnectError: [Errno 111] Connection refused`.
      AIRFLOW__API__BASE_URL: "http://localhost:8080"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://localhost:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-local-dev-not-a-secret}"
      # PINNED, and it has to be. Airflow INVENTS a Fernet key when none is set
      # while postgres keeps what it encrypted with the previous one, so the
      # first `make up` works and every one after fails with InvalidToken on any
      # stored credential -- which reads like a provisioning bug.
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-Zp8kRr7vQ2mN4xJ6wL9tY3bV5cX1aS0dF7gH8jK2lM4=}"
      # WHERE THE TARGET IS, by SERVICE NAME. The steps this product runs were
      # written for a host shell talking to published ports; inside the compose
      # network the same env vars name services instead, which is the whole
      # reason they are env vars and not constants.
      DATABRICKS_EMULATOR_URL: "http://databricks:8447"
      DATABRICKS_SPARK_CONNECT_URL: "http://spark-agent:8099"
      DATABRICKS_UC_URL: "http://uc:8080"
      DATABRICKS_TARGET: emulator
      CONTOSO_DELTA: /data/delta
      # WHERE THE PLATFORM PUT THE PRODUCT. The product asks rather than deriving
      # it from its own __file__: installed into site-packages, that derivation
      # pointed at `/home/airflow/.local/lib/python3.13/data/admin.pat`. Knowing
      # the mount point is the PLATFORM's job -- it is the one that mounted it.
      CONTOSO_PRODUCT_DIR: /opt/product
      # The credential this platform copies out of the emulator (`make token`).
      # Named rather than guessed, for the same reason.
      DATABRICKS_TOKEN_FILE: /opt/product/data/admin.pat
      # NOT under /opt/product, which is mounted read-only. Anything the client
      # library caches belongs somewhere writable that no product owns.
      DATABRICKS_DATA_DIR: /tmp/databricks-data
      # ONE FILE, SHARED BY EVERY TASK. Under an orchestrator tasks do not share
      # a working directory, so a run's own facts -- the warehouse id, the
      # landing date partition -- need a place all of them can see. On the delta
      # volume because that is the one every task already has.
      CONTOSO_STATE: /data/delta/state.json
      # The run's published numbers, on the shared volume rather than in a
      # task's working directory -- which under an orchestrator is nobody's.
      CONTOSO_SNAPSHOT: /data/delta/product_snapshot.json
      # ONE dbt VIRTUALENV, BUILT ONCE AND REUSED. Left unset, cosmos builds a
      # fresh venv per gold task -- nine of them, concurrently, through one uv
      # cache. That is not merely slow: they raced and one lost, with
      # `Failed to read from the distribution cache` on python-dateutil, which
      # surfaces as a dbt model failing for no reason a dbt log can explain.
      # The same install by hand succeeds every time, which is the tell.
      COSMOS_DBT_VENV: /tmp/cosmos-dbt-venv
      # THE VENDORS' OWN PUBLISHED KEYS. seed_secrets puts each vendor's real
      # key into the workspace secret scope, reading it from the same file the
      # vendor's own server reads -- never a literal, because a hand-written
      # credential here was wrong once and failed as an authentication error
      # against the vendor rather than as a typo in the product.
      SOURCES: /opt/sources
      # THE VENDORS, BY SERVICE NAME. The product's defaults are the Jobs
      # platform's PUBLISHED ports on localhost, which is right for a job
      # running on the operator's host and wrong for a task inside this network
      # -- `Connection refused` to localhost:18190, which reads like a dead
      # vendor rather than the wrong address. Every one is an env var precisely
      # so the platform can say where, and these are the names the generated
      # vendor fragment creates.
      POS_API_URL: "http://contoso-pos:8090"
      WEB_API_URL: "http://contoso-web:8091"
      REFERENCE_API_URL: "http://contoso-reference:8092"
      ERP_HOST: contoso-erp-db
      ERP_PORT: "5432"
      REDPANDA_BOOTSTRAP: "contoso-erp-broker:9092"
    ports:
      - "${AIRFLOW_PORT:-18082}:8080"
    volumes:
      - ${PRODUCT:?set PRODUCT to a data product repo, or run via make up}:/opt/product:ro
      # Read-only: the worker reads the vendors' published keys and writes
      # nothing here. The vendor containers mount the same tree.
      - ${SOURCES:?set SOURCES to a contoso-sources checkout, or run via make up}:/opt/sources:ro
      - ${DELTA_DATA:-/tmp/dbx-airflow-delta}:/data/delta
      - ${DATABRICKS_DATA:-./data}:/emu-data
      # See scripts/localhost_bridge.py: databricks-connect skips TLS only for
      # the literal name `localhost`, so the platform makes the target reachable
      # there rather than asking the product to know the network topology.
      - ./scripts/localhost_bridge.py:/opt/platform/localhost_bridge.py:ro
    command: bash -c "python3 /opt/platform/localhost_bridge.py & airflow db migrate && exec airflow standalone"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/version', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
